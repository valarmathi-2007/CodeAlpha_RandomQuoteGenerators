<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Quote Generator - CodeAlpha Task 2</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="bg-shape shape1"></div>
<div class="bg-shape shape2"></div>
<div class="container">
  <h1>Daily Inspiration</h1>
  <p class="subtitle">Random Quote Generator - CodeAlpha Task 2</p>
  <div class="quote-card" id="quoteCard">
    <div class="quote-icon">"</div>
    <p class="quote-text" id="quoteText">Loading...</p>
    <p class="quote-author" id="quoteAuthor">- Author</p>
    <div class="divider"></div>
    <div class="actions">
      <button class="btn btn-primary" id="newQuoteBtn">New Quote</button>
      <button class="btn btn-secondary" id="copyBtn">Copy</button>
      <button class="btn btn-secondary" id="tweetBtn">Tweet</button>
    </div>
  </div>
  <div class="footer">
    <p>Built by Valarmathi | CodeAlpha | <span id="count">0</span> quotes</p>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
